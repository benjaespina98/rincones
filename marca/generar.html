<!doctype html>
<meta charset="utf-8">
<title>Rincones — avatar</title>
<style>
  /* Un solo lienzo por carga (?v=oscuro|vino|violeta|claro), del tamaño exacto
     del viewport. Así la captura sale de 1080×1080 por construcción, sin
     depender de que el recorte por elemento clave los bordes. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  .canvas {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
  }

  /* 1. Oscuro: el fondo de la app. */
  .v-oscuro {
    background:
      radial-gradient(circle at 86% 0%, rgba(167, 130, 239, 0.22), transparent 38%),
      radial-gradient(circle at 0% 100%, rgba(198, 70, 95, 0.14), transparent 32%),
      linear-gradient(180deg, #090b13 0%, #111626 100%);
    color: #f4efff;
  }

  /* 2. Vino: color pleno. El más legible cuando el avatar mide 32px en un
     comentario, porque no depende de que se distinga un degradado oscuro. */
  .v-vino {
    background: linear-gradient(160deg, #8d1a30 0%, #5c0d1b 100%);
    color: #fff5f7;
  }

  /* 3. Violeta: el acento de la marca. */
  .v-violeta {
    background: linear-gradient(160deg, #8b64d8 0%, #5b3d96 100%);
    color: #fff;
  }

  /* 4. Claro: para fondos blancos, prensa y firmas de mail. */
  .v-claro { background: #f3f1f7; color: #17141f; }

  /* La marca ocupa el 52% del lienzo: entra holgada en el círculo inscrito
     (que es lo que Instagram deja ver) y sigue leyéndose a 32px. */
  svg { width: 52%; height: 52%; display: block; }
</style>

<script>
  /* El SVG es el mismo de client/src/components/Logo.jsx, trazo por trazo.

     El viewBox NO es el original (0 0 100 100): ahí la marca no está centrada
     —con el grosor de trazo incluido ocupa x[18.5, 72.5] e y[19.5, 86.5], o sea
     que su centro real es (45.5, 53)—. En la app da igual, es un ícono de 26px;
     en un avatar circular esos 4.5px de corrimiento se ven. Este viewBox es un
     cuadrado de 74 centrado en el dibujo real. */
  const variante = new URLSearchParams(location.search).get("v") || "oscuro";
  document.write(`
    <div class="canvas v-${variante}">
      <svg viewBox="8.5 16 74 74" role="img" aria-label="Rincones">
        <defs>
          <linearGradient id="vino" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b4223d"/>
            <stop offset="1" stop-color="#6d0f20"/>
          </linearGradient>
        </defs>
        <path d="M32 22 h23 a17 17 0 0 1 0 34 h-23 Z" fill="url(#vino)"/>
        <g fill="none" stroke="currentColor" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 22 h23 a17 17 0 0 1 0 34 h-23"/>
          <path d="M32 22 V84"/>
          <path d="M21 84 q11 -6 22 0"/>
          <path d="M52 56 L70 84"/>
        </g>
      </svg>
    </div>`);
</script>
