<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS no rasteriza SVG para el ícono de "Agregar a inicio": sin un PNG acá,
         Safari cae a una captura de la página en vez del logo. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fuentes: preconnect + carga no bloqueante con display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Rincones — tu bodega personal. Escaneá etiquetas, coleccioná y descubrí tus vinos." />
    <!-- __SITE_URL__ sale de VITE_SITE_URL en build time (ver vite.config.js).
         Sin esa variable, queda en rincones.vercel.app — el dominio actual. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <!-- Open Graph: preview al compartir el link (WhatsApp, redes, etc.) -->
    <meta property="og:site_name" content="Rincones" />
    <meta property="og:title" content="Rincones — tu bodega personal" />
    <meta property="og:description" content="Escaneá etiquetas, coleccioná tus vinos y descubrí cada rincón de cada botella." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rincones — tu bodega personal de vinos" />
    <meta property="og:locale" content="es_AR" />
    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rincones — tu bodega personal" />
    <meta name="twitter:description" content="Escaneá etiquetas, coleccioná tus vinos y descubrí cada rincón de cada botella." />
    <meta name="twitter:image" content="https://rincones.vercel.app/og-image.png" />
    <meta name="apple-mobile-web-app-title" content="Rincones" />
    <title>Rincones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
