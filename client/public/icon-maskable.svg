<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4223d"/>
      <stop offset="1" stop-color="#6d0f20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#a782ef" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a782ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#bg)"/>
  <rect x="0" y="0" width="100" height="100" fill="url(#glow)"/>
  <!-- `scale(0.76)` es el encogido que pide un ícono maskable: Android puede
       recortarlo en círculo, en gota o en cuadrado redondeado, así que la marca
       tiene que vivir dentro de la "zona segura" central.

       El escalado ya se hacía alrededor de (50, 53) —alguien había notado que
       el centro vertical no era 50—, pero el horizontal seguía en 50 y el real
       es 46.5 (ver src/components/Logo.jsx). El `translate` de afuera corrige
       eso: primero se centra la marca en la placa, después se encoge. -->
  <g transform="translate(3.5 -3)">
  <g transform="translate(50 50) scale(0.76) translate(-50 -50)">
  <path d="M32 22 h23 a17 17 0 0 1 0 34 h-23 Z" fill="url(#wine)"/>
  <g fill="none" stroke="#efeaff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 22 h23 a17 17 0 0 1 0 34 h-23"/>
    <path d="M32 22 V84"/>
    <path d="M21 84 q11 -6 22 0"/>
    <path d="M52 56 L70 84"/>
  </g>
  </g>
  </g>
</svg>
